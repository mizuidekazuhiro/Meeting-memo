name: Deploy meeting-memo worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.76.0

      - name: Fail fast if placeholder config exists
        shell: bash
        run: |
          set -euo pipefail
          echo "[Preflight] Scanning repository for placeholder values that must never be deployed"
          if rg -n --hidden \
            --glob '!.git/**' \
            --glob '!node_modules/**' \
            --glob '!.wrangler/**' \
            --glob '!.github/workflows/deploy-worker.yml' \
            'replace-with-your-recording-job-kv-id|replace-with-your-[A-Za-z0-9_-]+' .; then
            echo "❌ Placeholder configuration value detected. Replace it before deploy."
            exit 1
          fi
          recording_job_kv_id="$(awk '
            /^\[\[kv_namespaces\]\]$/ { in_block=1; binding=""; id=""; next }
            in_block && /^\[\[/ {
              if (binding == "RECORDING_JOB_KV") {
                print id
                exit
              }
              in_block=0
            }
            in_block && /^binding[[:space:]]*=/ {
              line=$0; sub(/^[^=]*=[[:space:]]*"/, "", line); sub(/".*$/, "", line); binding=line
            }
            in_block && /^id[[:space:]]*=/ {
              line=$0; sub(/^[^=]*=[[:space:]]*"/, "", line); sub(/".*$/, "", line); id=line
            }
            END {
              if (in_block && binding == "RECORDING_JOB_KV") {
                print id
              }
            }
          ' wrangler.toml)"
          if [[ -z "${recording_job_kv_id}" ]]; then
            echo "❌ RECORDING_JOB_KV namespace id is missing in wrangler.toml"
            exit 1
          fi
          if [[ "${recording_job_kv_id}" == "replace-with-your-recording-job-kv-id" || "${recording_job_kv_id}" == replace-with-your-* ]]; then
            echo "❌ RECORDING_JOB_KV namespace id is still a placeholder in wrangler.toml"
            exit 1
          fi
          echo "✅ No placeholder configuration values found."

      - name: Show Wrangler config source for deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "[Preflight] Wrangler deploy config file: wrangler.toml"
          echo "[Preflight] RECORDING_JOB_KV binding from wrangler.toml:"
          awk '
            /^\[\[kv_namespaces\]\]$/ { in_block=1; binding=""; id=""; next }
            in_block && /^\[\[/ {
              if (binding == "RECORDING_JOB_KV") {
                printf("  - binding=%s, id=%s\n", binding, id)
              }
              in_block=0
            }
            in_block && /^binding[[:space:]]*=/ {
              line=$0; sub(/^[^=]*=[[:space:]]*"/, "", line); sub(/".*$/, "", line); binding=line
            }
            in_block && /^id[[:space:]]*=/ {
              line=$0; sub(/^[^=]*=[[:space:]]*"/, "", line); sub(/".*$/, "", line); id=line
            }
            END {
              if (in_block && binding == "RECORDING_JOB_KV") {
                printf("  - binding=%s, id=%s\n", binding, id)
              }
            }
          ' wrangler.toml

      - name: Deploy worker code
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] DEPLOY worker code with wrangler deploy"
          npx wrangler@4.76.0 deploy --name meeting-memo

      - name: Confirm active deployment after code deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] GET deployment status after code deploy"
          npx wrangler@4.76.0 deployments status --name meeting-memo --json | tee deployment-status-after-code.json

  sync-secrets:
    needs: deploy-worker
    uses: ./.github/workflows/sync-worker-secrets.yml
    secrets: inherit

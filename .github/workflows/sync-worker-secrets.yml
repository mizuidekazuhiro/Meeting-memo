name: Sync meeting-memo worker secrets

on:
  workflow_dispatch:
  workflow_call:

jobs:
  sync-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.76.0

      - name: Prepare Cloudflare secret payload
        id: prepare
        shell: bash
        env:
          INTERVIEW_WEBHOOK_SECRET: ${{ secrets.INTERVIEW_WEBHOOK_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          INBOX_DB_ID: ${{ secrets.INBOX_DB_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          payload_file="$(mktemp "${RUNNER_TEMP:-/tmp}/meeting-memo-secrets.XXXXXX.json")"
          before_versions_file="$(mktemp "${RUNNER_TEMP:-/tmp}/meeting-memo-versions-before.XXXXXX.json")"
          after_versions_file="$(mktemp "${RUNNER_TEMP:-/tmp}/meeting-memo-versions-after.XXXXXX.json")"

          export PAYLOAD_FILE="$payload_file"
          export BEFORE_VERSIONS_FILE="$before_versions_file"
          export AFTER_VERSIONS_FILE="$after_versions_file"

          node <<'NODE'
          const fs = require("fs");

          const required = [
            "INTERVIEW_WEBHOOK_SECRET",
            "NOTION_TOKEN",
            "INBOX_DB_ID",
            "OPENAI_API_KEY"
          ];

          const values = {};
          for (const key of required) {
            const value = process.env[key] || "";
            if (!value) {
              process.stderr.write(`Missing required GitHub Secret: ${key}\n`);
              process.exit(1);
            }
            values[key] = value;
          }

          const dropboxAccessToken = process.env.DROPBOX_ACCESS_TOKEN || "";
          const refreshFields = {
            DROPBOX_APP_KEY: process.env.DROPBOX_APP_KEY || "",
            DROPBOX_APP_SECRET: process.env.DROPBOX_APP_SECRET || "",
            DROPBOX_REFRESH_TOKEN: process.env.DROPBOX_REFRESH_TOKEN || ""
          };

          const refreshValues = Object.values(refreshFields);
          const refreshComplete = refreshValues.every(Boolean);
          const refreshPartial = refreshValues.some(Boolean) && !refreshComplete;

          let mode;
          if (dropboxAccessToken) {
            values.DROPBOX_ACCESS_TOKEN = dropboxAccessToken;
            mode = "access_token";
          } else if (refreshComplete) {
            Object.assign(values, refreshFields);
            mode = "refresh_token";
          } else {
            if (refreshPartial) {
              const missing = Object.entries(refreshFields)
                .filter(([, value]) => !value)
                .map(([key]) => key);
              process.stderr.write(
                `Dropbox credentials are not fully configured. Missing: ${missing.join(", ")}\n`
              );
            } else {
              process.stderr.write(
                "Dropbox credentials are not fully configured. Provide DROPBOX_ACCESS_TOKEN or all of DROPBOX_APP_KEY, DROPBOX_APP_SECRET, and DROPBOX_REFRESH_TOKEN.\n"
              );
            }
            process.exit(1);
          }

          fs.writeFileSync(process.env.PAYLOAD_FILE, JSON.stringify(values));
          process.stdout.write(`mode=${mode}\n`);
          NODE

          echo "payload_file=$payload_file" >> "$GITHUB_OUTPUT"
          echo "before_versions_file=$before_versions_file" >> "$GITHUB_OUTPUT"
          echo "after_versions_file=$after_versions_file" >> "$GITHUB_OUTPUT"
          echo "Prepared Cloudflare Worker secret payload for meeting-memo."

      - name: Inspect deployment status before secret sync
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] GET current deployment status"
          npx wrangler@4.76.0 deployments status --name meeting-memo --json | tee deployment-status-before.json

      - name: Capture versions before secret sync
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] LIST versions before uploading secrets"
          npx wrangler@4.76.0 versions list --name meeting-memo --json | tee "${{ steps.prepare.outputs.before_versions_file }}"

      - name: Upload secret-only version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] CREATE version with secrets via wrangler versions secret bulk"
          npx wrangler@4.76.0 versions secret bulk --name meeting-memo "${{ steps.prepare.outputs.payload_file }}" \
            --message "Sync secrets from GitHub Actions"

      - name: Capture versions after secret sync
        id: version-diff
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE_VERSIONS_FILE: ${{ steps.prepare.outputs.before_versions_file }}
          AFTER_VERSIONS_FILE: ${{ steps.prepare.outputs.after_versions_file }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] LIST versions after uploading secrets"
          npx wrangler@4.76.0 versions list --name meeting-memo --json | tee "$AFTER_VERSIONS_FILE"

          node <<'NODE'
          const fs = require("fs");

          const readJson = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
          const before = readJson(process.env.BEFORE_VERSIONS_FILE);
          const after = readJson(process.env.AFTER_VERSIONS_FILE);

          const pickId = (item) => item.id || item.version_id || item.versionId;
          const beforeIds = new Set(before.map(pickId).filter(Boolean));
          const newVersion = after.find((item) => {
            const id = pickId(item);
            return id && !beforeIds.has(id);
          }) || after[0];

          const newVersionId = newVersion && pickId(newVersion);
          if (!newVersionId) {
            process.stderr.write("Unable to determine the new Worker version created by secret sync.\n");
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_id=${newVersionId}\n`);
          process.stdout.write(`New secret version: ${newVersionId}\n`);
          NODE

      - name: Activate the secret version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] DEPLOY secret version to 100% traffic"
          npx wrangler@4.76.0 versions deploy "${{ steps.version-diff.outputs.version_id }}@100%" --name meeting-memo --message "Activate secret sync version" --yes

      - name: Inspect deployment status after secret sync
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "[Cloudflare API] GET deployment status after secret activation"
          npx wrangler@4.76.0 deployments status --name meeting-memo --json | tee deployment-status-after.json

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f "${{ steps.prepare.outputs.payload_file }}"                 "${{ steps.prepare.outputs.before_versions_file }}"                 "${{ steps.prepare.outputs.after_versions_file }}"

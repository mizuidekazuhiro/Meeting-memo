name: Test meeting-memo

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript
        run: npm install --no-save typescript@5.9.3

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

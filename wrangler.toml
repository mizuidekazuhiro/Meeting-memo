name = "meeting-memo"
main = "src/index.ts"
compatibility_date = "2026-03-22"
workers_dev = true

[observability]
enabled = true

[vars]
DROPBOX_INTERVIEW_SCAN_FOLDER = "/Apps/MeetingMemo/inbox"
DROPBOX_INTERVIEW_SCAN_RECURSIVE = "false"
INTERVIEW_SCAN_MAX_FILES = "20"
DROPBOX_UPLOAD_FOLDER = "/Apps/MeetingMemo/inbox"

INTERVIEW_REVIEW_ENABLED = "true"
INTERVIEW_REVIEW_WEB_SEARCH_ENABLED = "true"
OPENAI_MODEL_REVIEW = "gpt-5.4-mini"

GMAIL_NOTIFY_ENABLED = "true"
MAIL_SUBJECT_PREFIX = "Meeting Memo作成完了 "
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
INBOX_TRIAGE_BASE_URL = "https://notion-inbox-triage.kazuhiro-mizuide.workers.dev"

[[kv_namespaces]]
binding = "RECORDING_JOB_KV"
id = "a6760676704e4a1fac83ddff1b16222d"
